<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Minutaggio · Calcio a 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#16241C; --bg-raised:#1D2F24; --line:#2E4536; --ink:#F2EFE6; --ink-dim:#9FB0A3; --amber:#E8A33D; --green-line:#6FA47C; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Archivo',sans-serif;min-height:100vh;overscroll-behavior-y:contain}.wrap{max-width:480px;margin:0 auto;padding:0 0 40px}.clockbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:18px 20px 14px}.clock-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.clock-time{font-family:'Fraunces',serif;font-weight:500;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}.clock-label{font-size:12px;color:var(--ink-dim);margin-bottom:4px}.clock-actions{display:flex;gap:8px}.btn{font-family:'Archivo',sans-serif;font-size:14px;font-weight:500;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 16px;cursor:pointer}.btn:active{transform:scale(.97)}.btn-primary{background:var(--amber);border-color:var(--amber);color:#2A1B04}.btn-ghost{color:var(--ink-dim)}.btn-sm{padding:7px 12px;font-size:13px}.count-row{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--ink-dim)}.count-badge{color:var(--ink);font-weight:500}.count-badge.full{color:var(--amber)}.section{padding:18px 20px 6px}.section-title{font-size:13px;color:var(--ink-dim);margin:0 0 8px;display:flex;justify-content:space-between}.section-hint{font-size:11px;opacity:.75}.player-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}.field-marker{width:3px;align-self:stretch;flex-shrink:0}.field-marker.on{background:var(--amber)}.field-marker.off{background:var(--line)}.player-name{flex:1;font-size:16px;font-weight:500}.player-time{font-variant-numeric:tabular-nums;font-size:17px;color:var(--ink-dim);min-width:56px;text-align:right}.player-time.on{color:var(--amber);font-weight:500}.player-remove{font-size:18px;color:var(--ink-dim);opacity:.5;padding:4px 6px}.empty-state{padding:30px 4px;color:var(--ink-dim);font-size:14px;line-height:1.6}.add-row{display:flex;gap:8px;padding:14px 20px 10px}input[type=text]{flex:1;background:var(--bg-raised);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:15px 'Archivo',sans-serif;padding:10px 12px}input:focus{outline:none;border-color:var(--green-line)}.footer-actions{display:flex;justify-content:center;padding:20px}.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}.confirm-overlay.show{display:flex}.confirm-sheet{background:var(--bg-raised);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:20px 20px 26px;width:100%;max-width:480px}.confirm-sheet p{margin:0 0 16px;font-size:15px;line-height:1.5}.confirm-sheet .btn{width:100%;margin-bottom:8px}
</style>
</head><body><div class="wrap"><div class="clockbar"><div class="clock-row"><div><div class="clock-label">Tempo di gioco</div><div class="clock-time" id="matchClock">00:00</div></div><div class="clock-actions"><button class="btn btn-ghost btn-sm" id="resetBtn">Azzera</button><button class="btn btn-primary" id="startPauseBtn">Avvia</button></div></div><div class="count-row"><span>In campo: <span class="count-badge" id="fieldCount">0</span></span><span id="rosterCount">0 in rosa</span></div></div><div class="section"><div class="section-title"><span>In campo</span><span class="section-hint">tocca per far uscire</span></div><div id="fieldList"></div></div><div class="section"><div class="section-title"><span>In panchina</span><span class="section-hint">tocca per far entrare</span></div><div id="benchList"></div></div><div class="add-row"><input type="text" id="newPlayerInput" placeholder="Nome giocatore"><button class="btn" id="addPlayerBtn">Aggiungi</button></div><div class="footer-actions"><button class="btn btn-ghost btn-sm" id="newMatchBtn">Nuova partita</button></div></div><div class="confirm-overlay" id="confirmOverlay"><div class="confirm-sheet"><p id="confirmText"></p><button class="btn btn-primary" id="confirmYes">Conferma</button><button class="btn btn-ghost" id="confirmNo">Annulla</button></div></div>
<script>
(function(){
var STORAGE_KEY='match-tracker-state-v1';
var DEFAULT_PLAYERS=['FILIPPO CIVATI','LUCA LAFFRANCHI','TOMMASO DEL SARTO','SIMONE TAVECCHIO','NADER KHACHANE','ABOU ELKASSEM FAROUK','FEDI TAHARI','JACOPO LURASCHI',"TOMMASO PELLICANO'",'ALFREDO FAVILLA','DAVIDE ENESI','CHRISTIAN PIROVANO'];
function defaultPlayers(){return DEFAULT_PLAYERS.map(function(name,index){return{id:'default-'+index,name:name,onField:false,accumulated:0,fieldSince:null};});}
var state={players:defaultPlayers(),match:{running:false,elapsedBase:0,startTs:null}};
function uid(){return'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmt(ms){var t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60,p=function(n){return n<10?'0'+n:''+n};return h>0?h+':'+p(m)+':'+p(s):p(m)+':'+p(s)}
function matchElapsed(){var e=state.match.elapsedBase;if(state.match.running&&state.match.startTs)e+=Date.now()-state.match.startTs;return e}
function playerElapsed(p){var e=p.accumulated;if(p.onField&&state.match.running&&p.fieldSince)e+=Date.now()-p.fieldSince;return e}
var saveTimeout=null;function persist(){clearTimeout(saveTimeout);saveTimeout=setTimeout(function(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}},150)}
function load(){try{var saved=localStorage.getItem(STORAGE_KEY);if(saved){try{var parsed=JSON.parse(saved);if(parsed&&parsed.players&&parsed.players.length>0)state=parsed}catch(e){}}render()}catch(e){render()}}
function addPlayer(name){name=name.trim();if(!name)return;state.players.push({id:uid(),name:name,onField:false,accumulated:0,fieldSince:null});persist();render()}
function removePlayer(id){state.players=state.players.filter(function(p){return p.id!==id});persist();render()}
function toggleField(id){var p=state.players.find(function(p){return p.id===id});if(!p)return;var now=Date.now();if(p.onField){if(state.match.running&&p.fieldSince)p.accumulated+=now-p.fieldSince;p.onField=false;p.fieldSince=null}else{p.onField=true;p.fieldSince=state.match.running?now:null}persist();render()}
function startPause(){var now=Date.now();if(state.match.running){state.match.elapsedBase+=now-state.match.startTs;state.match.startTs=null;state.match.running=false;state.players.forEach(function(p){if(p.onField&&p.fieldSince){p.accumulated+=now-p.fieldSince;p.fieldSince=null}})}else{state.match.running=true;state.match.startTs=now;state.players.forEach(function(p){if(p.onField)p.fieldSince=now})}persist();render()}
function resetTimes(){state.match={running:false,elapsedBase:0,startTs:null};state.players.forEach(function(p){p.accumulated=0;p.fieldSince=null});persist();render()}
function newMatch(){state.match={running:false,elapsedBase:0,startTs:null};state.players.forEach(function(p){p.accumulated=0;p.fieldSince=null;p.onField=false});persist();render()}
function render(){document.getElementById('matchClock').textContent=fmt(matchElapsed());document.getElementById('startPauseBtn').textContent=state.match.running?'Pausa':(state.match.elapsedBase>0?'Riprendi':'Avvia');var on=state.players.filter(function(p){return p.onField}),bench=state.players.filter(function(p){return!p.onField});on.sort(function(a,b){return playerElapsed(b)-playerElapsed(a)});bench.sort(function(a,b){return playerElapsed(a)-playerElapsed(b)});var c=document.getElementById('fieldCount');c.textContent=on.length;c.className='count-badge'+(on.length===7?' full':'');document.getElementById('rosterCount').textContent=state.players.length+' in rosa';var f=document.getElementById('fieldList'),b=document.getElementById('benchList');f.innerHTML=on.length?on.map(rowHtml).join(''):'<div class="empty-state">Nessuno in campo. Tocca un giocatore in panchina per farlo entrare.</div>';b.innerHTML=bench.length?bench.map(rowHtml).join(''):(state.players.length?'<div class="empty-state">Tutti in campo.</div>':'<div class="empty-state">Aggiungi i giocatori della rosa qui sotto per iniziare.</div>');Array.prototype.forEach.call(document.querySelectorAll('.player-row'),function(r){r.addEventListener('click',function(e){if(!e.target.classList.contains('player-remove'))toggleField(r.getAttribute('data-id'))})});Array.prototype.forEach.call(document.querySelectorAll('.player-remove'),function(x){x.addEventListener('click',function(e){e.stopPropagation();removePlayer(x.getAttribute('data-id'))})})}
function rowHtml(p){return'<div class="player-row" data-id="'+p.id+'"><div class="field-marker '+(p.onField?'on':'off')+'"></div><div class="player-name">'+escapeHtml(p.name)+'</div><div class="player-time '+(p.onField?'on':'')+'">'+fmt(playerElapsed(p))+'</div><div class="player-remove" data-id="'+p.id+'">&times;</div></div>'}
function escapeHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function showConfirm(text,onYes){var o=document.getElementById('confirmOverlay'),y=document.getElementById('confirmYes'),n=document.getElementById('confirmNo');document.getElementById('confirmText').textContent=text;o.classList.add('show');function clean(){o.classList.remove('show');y.removeEventListener('click',yes);n.removeEventListener('click',no)}function yes(){clean();onYes()}function no(){clean()}y.addEventListener('click',yes);n.addEventListener('click',no)}
document.getElementById('startPauseBtn').addEventListener('click',startPause);document.getElementById('resetBtn').addEventListener('click',function(){showConfirm('Azzerare tutti i tempi e fermare il cronometro? La formazione in campo resta invariata.',resetTimes)});document.getElementById('newMatchBtn').addEventListener('click',function(){showConfirm('Iniziare una nuova partita? Tutti i giocatori torneranno in panchina e i tempi si azzerano.',newMatch)});document.getElementById('addPlayerBtn').addEventListener('click',function(){var i=document.getElementById('newPlayerInput');addPlayer(i.value);i.value='';i.focus()});document.getElementById('newPlayerInput').addEventListener('keydown',function(e){if(e.key==='Enter'){addPlayer(this.value);this.value=''}});setInterval(render,1000);load();
})();
</script></body></html>
